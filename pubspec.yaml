name: merkez_blok_oyunlari
description: "Blok Oyunları merkez uygulaması (Blok Bulmaca, Blok Sudoku). Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 6080e4b00e322e2191d0358100b4b48b4a1fc883
  # Merkezdeki oyunlar (her biri kendi deposunda)
  game_001_block_puzzle_master:
    git:
      url: https://github.com/taktemurr-ops/game-001-block-puzzle-master
      ref: 6103cca590f3ccf07f9e0f3530929d555026d814
  oyun_blok_sudoku:
    git:
      url: https://github.com/taktemurr-ops/oyun-blok-sudoku
      ref: e062a975ef31e4607198eeb9026c42f9f679288e
  oyun_blok_doldurma:
    git:
      url: https://github.com/taktemurr-ops/oyun-blok-doldurma
      ref: caf618275ca6b46263ad81dcc3acd34bb989bf1a
  oyun_dusen_bloklar:
    git:
      url: https://github.com/taktemurr-ops/oyun-dusen-bloklar
      ref: 8fbebd9c3ba54fbbcbeded65bdc522e17ea3728d
  oyun_blok_cesit_paketi:
    git:
      url: https://github.com/taktemurr-ops/oyun-blok-cesit-paketi
      ref: 36622c3c7a501075c1c88cacdf15ede355ecd271
  oyun_altigen_blok:
    git:
      url: https://github.com/taktemurr-ops/oyun-altigen-blok
      ref: 7b30c9ae1ead3c1db91fdd6f0bb1258f674dc234
  oyun_blok_kaydirma:
    git:
      url: https://github.com/taktemurr-ops/oyun-blok-kaydirma
      ref: c21077c6dae48e0b8579d427e88296e77236655f
  oyun_sayili_blok_dusurme:
    git:
      url: https://github.com/taktemurr-ops/oyun-sayili-blok-dusurme
      ref: 30d44cca31b472bfbd1d201adebfd2825ead3929
  oyun_altigen_dusen_bloklar:
    git:
      url: https://github.com/taktemurr-ops/oyun-altigen-dusen-bloklar
      ref: 8cebd1afcf9b386cc4c631643d38964237794cde
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Blok motoru: bütün blok oyunları aynı sürümü kullansın.
  game_001_block_puzzle_master:
    git:
      url: https://github.com/taktemurr-ops/game-001-block-puzzle-master
      ref: 6103cca590f3ccf07f9e0f3530929d555026d814
  # Tüm oyunlar aynı çekirdek sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 6080e4b00e322e2191d0358100b4b48b4a1fc883

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#283593"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#283593"
    theme_color: "#283593"

flutter_native_splash:
  color: "#283593"
  image: assets/branding/splash.png
  android_12:
    color: "#283593"
    image: assets/branding/splash_android12.png
  web: true
